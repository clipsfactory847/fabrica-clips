name: Fabrica de clips

on:
  schedule:
    - cron: "23 */6 * * *"   # cada 6 horas, solo
  workflow_dispatch:
    inputs:
      enlace:
        description: "Opcional: enlace de un directo de Twitch para analizarlo entero (vacío = buscar clips populares)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: fabrica
  cancel-in-progress: false

jobs:
  fabrica:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar programas de vídeo
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Instalar librerías
        run: pip install -q -r requirements.txt

      - name: Ejecutar la fábrica
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          ENLACE: ${{ inputs.enlace }}
        run: python -m fabrica.main

      - name: Guardar copia de los clips (7 días)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clips-${{ github.run_number }}
          path: salida/
          retention-days: 7
          if-no-files-found: ignore

      - name: Guardar el registro de lo procesado
        if: always()
        run: |
          git config user.name "fabrica-bot"
          git config user.email "fabrica-bot@users.noreply.github.com"
          git add estado/
          git diff --cached --quiet || (git commit -m "Registro actualizado" && git pull --rebase -q && git push)
