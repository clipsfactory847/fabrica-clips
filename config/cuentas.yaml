# ==========================================================
#  CONFIGURACIÓN DE TUS CUENTAS DE CLIPS
#  Aquí es donde añadirás cuentas, categorías y streamers.
# ==========================================================

cuentas:
  - nombre: "Clips de streamers"
    activa: true

    # ----- DE DÓNDE SACAR LOS CLIPS -----
    # Categorías de Twitch (nombre exacto, como sale en Twitch).
    # Se buscan los clips más vistos de CUALQUIER streamer en ese idioma.
    categorias:
      - "Just Chatting"
      - "Grand Theft Auto V"
      - "Fortnite"
      - "Minecraft"
      - "IRL"

    # Streamers concretos que quieres vigilar siempre (opcional).
    streamers:
      - ibai
      - auronplay
      - elxokas
      - illojuan

    idioma: es            # solo clips en español
    horas_atras: 36       # buscar clips creados en las últimas X horas
    vistas_minimas: 300   # ignorar clips con menos visualizaciones

    # ----- CALIDAD -----
    clips_por_ejecucion: 3   # máximo de clips que te llegan cada vez
    candidatos_a_revisar: 15 # cuántos clips populares analiza la IA cada vez
    puntuacion_minima: 8     # nota mínima (1-10) para mandártelo
    duracion_min: 12
    duracion_max: 58

    # ----- ESTILO DE EDICIÓN -----
    estilo:
      zoom: 1.25
      color_subtitulos: amarillo   # amarillo, blanco o verde
      palabras_por_subtitulo: 3
      titulo_en_pantalla: true

    hashtags_fijos: ["#shorts", "#twitch", "#streamer"]
