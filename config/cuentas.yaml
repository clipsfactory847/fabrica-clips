# ==========================================================
#  CONFIGURACIÓN DE TUS CUENTAS DE CLIPS
#  Aquí es donde añadirás cuentas, categorías y streamers.
# ==========================================================

cuentas:
  - nombre: "Clips de streamers"
    activa: true

    # ----- DE DÓNDE SACAR LOS CLIPS -----
    # Categorías de Twitch (nombre exacto, como sale en Twitch).
    # Se buscan los clips más vistos de CUALQUIER streamer en ese idioma.
    categorias:
      - "Grand Theft Auto VI"
      - "Just Chatting"
      - "Grand Theft Auto V"
      - "Fortnite"
      - "Minecraft"
      - "IRL"

    # Streamers concretos que quieres vigilar siempre (opcional).
    streamers:
      - ibai
      - auronplay
      - elxokas
      - illojuan
      - thegrefg
      - rubius
      - elspreen
      - rivers_gg
      - juansguarnizo
      - sezar_blue
      - mayichi
      - danirep

    idioma: es            # solo clips en español
    horas_atras: 36       # buscar clips creados en las últimas X horas
    vistas_minimas: 300   # ignorar clips con menos visualizaciones
    seguir_tendencias: true  # mirar también los directos en español más vistos AHORA (lo que está de moda)
    directos_tendencia: 60   # cuántos directos en vivo revisar
    horas_tendencia: 12      # ventana para calcular lo más viral

    # ----- CALIDAD -----
    clips_por_ejecucion: 5   # máximo de clips que te llegan cada vez
    candidatos_a_revisar: 30 # cuántos clips populares analiza la IA cada vez
    puntuacion_minima: 7     # nota mínima (1-10) para mandártelo
    nota_rescate: 6          # si ninguno llega, te mando el mejor de la ronda si tiene al menos esta nota
    duracion_min: 12
    duracion_max: 58

    # ----- ESTILO DE EDICIÓN -----
    estilo:
      zoom: 1.25
      color_subtitulos: amarillo   # amarillo, blanco o verde
      palabras_por_subtitulo: 3
      titulo_en_pantalla: true
      formato_auto: true          # pantalla dividida (cara arriba, juego abajo) cuando se detecta la cámara

    hashtags_fijos: ["#shorts", "#twitch", "#streamer"]

# ==========================================================
#  PUBLICACIÓN (vía Buffer) — al pulsar ✅ Aprobar en Telegram
# ==========================================================
publicacion:
  # Cada clip aprobado se programa a una hora fija. YouTube solo deja subir unos pocos vídeos
  # al día en canales nuevos, así que el bot nunca programa más de "youtube_max_24h"
  # en 24 horas y deja al menos "horas_entre_videos" entre uno y otro.
  horas_youtube: ["13:30", "18:00", "21:30"]   # horas preferidas (hora de Madrid)
  youtube_max_24h: 2                  # Buffer gratis: máximo 2 en YouTube cada 24 h (de pago: 5 o más)
  margen_minutos: 5                   # margen de seguridad sobre las 24 h de YouTube
  horas_entre_videos: 3
  # Redes donde Buffer te manda un aviso al móvil para terminar tú la publicación
  # (TikTok, porque tu cuenta es personal)
  con_aviso: [tiktok]
  # Subidas que ya hizo YouTube (para contar bien el límite al empezar)
  youtube_ya_subidos: ["2026-11-22T15:00:00.000Z", "2026-11-22T18:30:00.000Z", "2026-11-23T18:30:00.000Z"]
  # Clips que YouTube rechazó por el límite: el bot los vuelve a programar una sola vez
  reintentar_youtube:
    - DeafComfortablePizzaPraiseIt-dLNZKryPccdzHwer
    - PreciousVenomousKoupreyPipeHype-fYIqv-_bI91THlDG
    - RichElatedApplePraiseIt-99NWXeHa20FU1DK_
